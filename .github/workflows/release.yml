name: Release

# Tag a version to produce the exact zip that gets uploaded to the Chrome Web Store,
# attached to a GitHub release so there is a permanent record of what shipped.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag that disagrees with the manifest would ship the wrong version number.
      - name: Tag must match manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')
          echo "tag=$tag manifest=$manifest"
          [ "$tag" = "$manifest" ] || { echo "::error::tag $tag != manifest $manifest"; exit 1; }

      - run: npm run check
      - run: ./tools/package.sh

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
