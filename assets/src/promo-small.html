<!doctype html>
<meta charset="utf-8">
<title>Sweep — small promo tile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Google Sans", Roboto, -apple-system, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .tile {
    width: 440px; height: 280px;
    background: linear-gradient(145deg, #6366f1 0%, #4f46e5 48%, #4338ca 100%);
    padding: 30px 32px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 68%);
    right: -80px; top: -110px;
  }
  .mark { display: flex; align-items: center; gap: 11px; position: relative; }
  .mark .env {
    width: 38px; height: 38px; border-radius: 9px; background: rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center;
  }
  .mark .name { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  h1 {
    color: #fff; font-size: 30px; line-height: 1.18; font-weight: 700;
    letter-spacing: -.7px; position: relative;
  }
  h1 span { color: #c7d2fe; }
  p { color: #d5d8fb; font-size: 13.5px; position: relative; }
</style>

<div class="tile">
  <div class="glow"></div>

  <div class="mark">
    <div class="env">
      <svg width="21" height="21" viewBox="0 0 16 16">
        <rect x="2.6" y="4.2" width="10.8" height="7.6" fill="none" stroke="#fff" stroke-width="1.5"/>
        <path d="M2.6 4.2 L8 8.6 L13.4 4.2" fill="none" stroke="#fff" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="name">Sweep</div>
  </div>

  <h1>Delete every email<br>from one sender.<br><span>In two clicks.</span></h1>

  <p>No sign-in · Nothing leaves your browser</p>
</div>
